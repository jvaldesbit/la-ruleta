# ---------------------------------------------------------------------------
# nginx para el SPA de La Ruleta.
#
# Dos responsabilidades:
#   1. servir el bundle estático de Vite con fallback a index.html (rutas del
#      router las resuelve el cliente, no el servidor);
#   2. hacer de proxy de /api/ hacia el contenedor de la API, para que el
#      navegador hable siempre con el mismo origen y no haya CORS ni URLs
#      absolutas quemadas en el build.
# ---------------------------------------------------------------------------

# Con conexiones normales Connection debe ir vacío; solo en un upgrade real
# (WebSocket/SSE) vale "upgrade". Este map evita romper el keep-alive del
# proxy mandando "upgrade" en todas las peticiones.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Que el bundle no viaje sin comprimir; los .png/.jpg ya vienen comprimidos
    # y por eso no están en la lista.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # No anunciar la versión exacta de nginx.
    server_tokens off;

    # Cabeceras de seguridad básicas (sin CSP: el MVP no la necesita todavía y
    # una CSP mal puesta rompe el bundle de Vite en silencio).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Subidas pequeñas: aquí solo viajan JSON de apuestas.
    client_max_body_size 1m;

    # --- API -----------------------------------------------------------
    # "api" es el nombre del servicio en la red interna de Compose; Docker lo
    # resuelve por DNS. No se expone el puerto 8000 al exterior: todo el
    # tráfico entra por aquí.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Necesario si algún día se añade SSE/WebSocket para el sorteo en vivo.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Las respuestas de la API son estado de juego: nunca cacheadas.
        proxy_buffering off;
    }

    # --- Estáticos con hash --------------------------------------------
    # Vite renombra cada asset con un hash de contenido, así que un cambio
    # genera un nombre nuevo: se pueden cachear un año sin miedo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        log_not_found off;
    }

    # --- index.html y rutas del SPA ------------------------------------
    # index.html SÍ cambia bajo el mismo nombre en cada despliegue: si se
    # cachea, el navegador seguiría pidiendo assets de la versión anterior que
    # ya no existen. Por eso no-store.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
