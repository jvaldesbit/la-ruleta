<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ficha de casino">
  <!-- Ficha de casino: tres formas y nada más, para que aguante a 16 px.
       Cuerpo rojo laca, muescas de canto en hueso, alma clara con filete de latón. -->
  <circle cx="16" cy="16" r="15" fill="#c1121f"/>
  <circle cx="16" cy="16" r="12.4" fill="none" stroke="#f6efe0" stroke-width="5.4"
          stroke-dasharray="7.6 8.0" stroke-dashoffset="3.8"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#0a0a09" stroke-width="1.4"/>
  <circle cx="16" cy="16" r="7.4" fill="#f6efe0"/>
  <circle cx="16" cy="16" r="7.4" fill="none" stroke="#d4ac52" stroke-width="1.8"/>
</svg>
